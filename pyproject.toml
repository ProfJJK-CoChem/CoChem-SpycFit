[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cochem-spycfit"
version = "0.1.0"
description = "Interactive Bayesian Fitting & Active Learning UI for CoChem-Studio"
dependencies = [
    "PySide6",
    "pluggy"
]

[project.entry-points."cochem_studio"]
cochem_spycfit = "cochem_spycfit.plugin"

[tool.setuptools.packages.find]
include = ["cochem_spycfit*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
