[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CoChem-SPYFY"
version = "0.1.0"
description = "Tripartite Workspace Air-Gap enabled computational spectroscopy fitter."
authors = [{name = "CoChem Swarm"}]
dependencies = [
    "jax",
    "jaxlib",
    "h5py",
    "zarr",
    "pyarrow",
    "plotly",
    "ipywidgets",
    "mendeleev",
    "platformdirs",
    "filelock",
    "pyzmq"
]

[project.entry-points."cochem.modules"]
spyfy = "cochem_spyfy.module_provider:spyfy_provider"

[project.optional-dependencies]
dev = ["pytest", "flake8"]
gpu = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cochem_spyfy*"]
