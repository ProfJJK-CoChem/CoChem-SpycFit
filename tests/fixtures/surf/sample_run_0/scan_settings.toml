[experiment]
sample_name = "HCOOH_DME"
sample_temp = 22.0
gas_name = "Ne"
gas_width = 600.0
backing_pressure = 15.0
chamber_pressure = "1.0e-6 torr"
mw_width = 1.0

[scan_parameters]
start_freq = 10899.0
end_freq = 10899.5
step_size = 0.5
zaber_speed = 0.003
acq_num = 100
cavity_type = "Continuous"

[digitizer_settings]
resolution = 10
acq_window = 14
apodization = "Hanning"

[timing_settings]
rep_rate = 5
valve_mw_delay = 1300
spdt_width = 10.0
acq_delay = 22.5

[output_settings]
filename = "sample_run"
location = "tests/fixtures/surf"
